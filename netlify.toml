[dev]
  port = 8765
  dir  = "."

# The ffmpeg binary is loaded at runtime by path (never require()d), so the
# bundler's dependency trace misses it — it must be included explicitly.
[functions."download"]
  included_files = ["node_modules/ffmpeg-static/ffmpeg"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from   = "/robots.txt"
  to     = "/robots.txt"
  status = 200

[[redirects]]
  from   = "/sitemap.xml"
  to     = "/sitemap.xml"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
